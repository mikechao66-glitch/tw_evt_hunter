name: Taiwan Stock Event Scanner

on:
  schedule:
    # 台灣時間週一至週五 08:00 - 14:00 (盤中)，每 30 分鐘一次 (加上偏移量避開尖峰)
    - cron: '8,38 0-5 * * 1-5'
    # 台灣時間週一至週五 14:00 - 24:00 (盤後)，每 2 小時一次
    - cron: '8 6-15/2 * * 1-5'
    # 台灣時間週六、週日 10:00 - 22:00，每 2 小時一次
    - cron: '8 2-14/2 * * 6,0'
  workflow_dispatch: # 允許手動從 GitHub 介面觸發

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允許寫入回倉庫

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Market Scan
        run: python sentinel.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add events.db keywords.json
          git commit -m "Auto-update events and config [skip ci]" || echo "No changes to commit"
          git push
